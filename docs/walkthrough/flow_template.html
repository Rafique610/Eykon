<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eykon pipeline map</title>
<!-- Template for build_flow.py. flow.html is generated from it: edit this file, then run the build. -->
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b2130; --muted: #5a6475; --line: #dde2ea; --soft: #eef1f5;
  --canvas: #f0f2f5; --dot: #d9dee6; --accent: #3b5bdb;
  --runtime: #4a5568; --offline: #c05621; --hl: #e8590c;
  --stage: #4c51bf; --file: #2b6cb0; --model: #805ad5; --algorithm: #2c7a7b; --data-store: #b7791f; --external: #718096;
  --inf: #b7791f; --unk: #c53030; --doc: #2f855a;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1218; --panel: #161a22; --ink: #e3e7ee; --muted: #9aa4b5; --line: #2a303c; --soft: #1d232e;
  --canvas: #0c0f14; --dot: #1b2029; --accent: #8da2fb;
  --runtime: #a0aec0; --offline: #f6ad55; --hl: #ff922b;
  --stage: #8c9bf7; --file: #63b3ed; --model: #b794f4; --algorithm: #4fd1c5; --data-store: #f6c35b; --external: #a0aec0;
  --inf: #f6c35b; --unk: #fc8181; --doc: #68d391;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.45 var(--font); background: var(--bg); color: var(--ink); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
code, pre { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }

header.top { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { white-space: nowrap; font-size: 15px; }
.brand strong { letter-spacing: .02em; }
#crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
#crumbs a { text-decoration: none; }
#crumbs b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.btn { background: var(--soft); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.link { background: none; border: none; color: var(--accent); padding: 5px 4px; }
.icon-btn { display: none; }
.search { position: relative; }
#q { width: 300px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
#q:focus { outline: 2px solid var(--accent); outline-offset: 0; }
#results { position: absolute; right: 0; top: calc(100% + 4px); width: 420px; max-height: 60vh; overflow: auto; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 4px; }
#results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
#results button:hover, #results button:focus { background: var(--soft); outline: none; }
#results .r-meta { display: block; color: var(--muted); font-size: 12px; }
#results .empty { padding: 8px; color: var(--muted); }

main { display: grid; grid-template-columns: 270px minmax(0, 1fr) 410px; min-height: 0; }
#side, #panel { overflow: auto; background: var(--panel); min-height: 0; }
#side { border-right: 1px solid var(--line); padding: 10px 14px 24px; }
#panel { border-left: 1px solid var(--line); padding: 14px 18px 30px; }
#side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 8px; }
#side section:first-child h2 { margin-top: 4px; }
#side select { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
fieldset { border: 0; padding: 0; margin: 0 0 10px; }
legend { font-weight: 600; margin-bottom: 4px; }
.check { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.radio-row { display: flex; gap: 12px; flex-wrap: wrap; }
#trace-ctl { display: flex; align-items: center; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
#trace-pos { color: var(--muted); font-size: 12px; min-width: 64px; text-align: center; }
#steps { list-style: none; padding: 0; margin: 6px 0 0; }
#steps li { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--bg); }
#steps li.cur { border-color: var(--hl); box-shadow: inset 3px 0 0 var(--hl); }
#steps button { display: flex; gap: 7px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px 2px; cursor: pointer; font-weight: 600; }
#steps .n { color: var(--hl); min-width: 18px; }
#steps .io { padding: 0 8px 6px 33px; font-size: 12px; color: var(--muted); }
#steps .io span { color: var(--ink); }
.legend-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 13px; }
.legend-row svg { flex: none; }

#canvas { position: relative; overflow: hidden; background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; min-height: 0; }
#svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#svg.dragging { cursor: grabbing; }
#hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; pointer-events: none; max-width: calc(100% - 24px); }

.node { cursor: pointer; }
.node .body { fill: var(--panel); stroke: var(--c); stroke-width: 1.5; }
.node .bar { fill: var(--c); }
.node.f-offline .body { stroke-dasharray: 6 3; }
.node.ghost { opacity: .6; }
.node.ghost .body { fill: var(--soft); stroke-dasharray: 2 3; }
.node.st-unused .body, .node.st-stub .body, .node.st-legacy .body, .node.st-planned .body { fill: url(#hatch); }
.node.sel .body { stroke: var(--accent); stroke-width: 3.5; }
.node.cur .body { stroke: var(--hl); stroke-width: 3.5; }
.node:focus { outline: none; }
.node:focus-visible .body { stroke: var(--accent); stroke-width: 3.5; }
.node.dim { opacity: .17; }
.node .lbl { font: 600 13px var(--font); fill: var(--ink); }
.node .sub, .node .cnt { font: 11.5px var(--font); fill: var(--muted); }
.t-stage { --c: var(--stage); } .t-file { --c: var(--file); } .t-model { --c: var(--model); }
.t-algorithm { --c: var(--algorithm); } .t-data-store { --c: var(--data-store); } .t-external { --c: var(--external); }
.badge rect { stroke: none; }
.badge text { font: 700 10px var(--font); fill: var(--panel); }
.b-inf rect { fill: var(--inf); } .b-unk rect { fill: var(--unk); } .b-st rect { fill: var(--muted); } .b-flag rect { fill: var(--offline); }
.stepdot circle { fill: var(--hl); } .stepdot text { font: 700 11px var(--font); fill: var(--panel); }
.hatch-bg { fill: var(--panel); } .hatch-line { stroke: var(--line); stroke-width: 3; }
.edge { fill: none; stroke-width: 1.6; }
.edge.f-runtime { stroke: var(--runtime); }
.edge.f-offline { stroke: var(--offline); stroke-dasharray: 8 5; }
.edge.hl { stroke: var(--hl); stroke-width: 3; }
.edge.dim { opacity: .1; }
.elabel rect { fill: var(--panel); stroke: var(--line); }
.elabel text { font: 11px var(--font); fill: var(--muted); }
.elabel.hl text { fill: var(--ink); font-weight: 600; }
.elabel.hl rect { stroke: var(--hl); }
.elabel.dim { opacity: .15; }
.m-runtime { fill: var(--runtime); } .m-offline { fill: var(--offline); } .m-hl { fill: var(--hl); }
.lane-label { font: 600 12px var(--font); fill: var(--muted); letter-spacing: .05em; text-transform: uppercase; }

#panel h2 { font-size: 19px; line-height: 1.25; margin: 6px 0 6px; }
#panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
#panel p { margin: 0 0 8px; }
.kicker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); background: var(--soft); white-space: nowrap; }
.pill.type { color: var(--panel); border-color: transparent; }
.pill.flow-offline { border-style: dashed; color: var(--offline); }
.pill.tag-INFERRED { background: var(--inf); color: var(--panel); border-color: transparent; }
.pill.tag-UNKNOWN { background: var(--unk); color: var(--panel); border-color: transparent; }
.pill.tag-DOCUMENTED { color: var(--doc); border-color: var(--doc); background: none; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.purpose { font-size: 15px; }
dl.io { display: grid; grid-template-columns: 74px 1fr; gap: 3px 10px; margin: 0; }
dl.io dt { color: var(--muted); font-size: 12.5px; }
dl.io dd { margin: 0; overflow-wrap: anywhere; }
table.params { border-collapse: collapse; width: 100%; font-size: 13px; }
table.params td { border-top: 1px solid var(--line); padding: 4px 6px 4px 0; vertical-align: top; overflow-wrap: anywhere; }
table.params td:first-child { font-family: var(--mono); font-size: 12px; white-space: nowrap; color: var(--muted); }
ul.plain { list-style: none; padding: 0; margin: 0; }
ul.plain li { padding: 3px 0; overflow-wrap: anywhere; }
.conn { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 8px; margin-bottom: 5px; cursor: pointer; }
.conn:hover { border-color: var(--accent); }
.conn .c-meta { display: block; font-size: 12px; color: var(--muted); }
.src { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
pre.md { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 420px; overflow: auto; }
details summary { cursor: pointer; color: var(--accent); margin: 6px 0; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13px; }
.stat span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }

@media (max-width: 1180px) {
  main { grid-template-columns: minmax(0, 1fr) 360px; }
  .icon-btn { display: inline-block; }
  #side { display: none; position: absolute; z-index: 15; top: 47px; left: 0; bottom: 0; width: 290px; box-shadow: 8px 0 24px rgba(0,0,0,.18); }
  #side.open { display: block; }
  #q { width: 200px; }
}
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 42vh; }
  #panel { border-left: 0; border-top: 1px solid var(--line); }
  .brand, #labels { display: none; }
  #q { width: 140px; }
  #results { width: 88vw; }
}
</style>
</head>
<body>
<header class="top">
  <button id="menu" class="btn icon-btn" aria-label="Filters, trace and legend" aria-expanded="false">☰</button>
  <div class="brand"><strong>Eykon</strong> pipeline map</div>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="spacer"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search nodes, files, models  ( / )" aria-label="Search the pipeline" autocomplete="off">
    <div id="results" hidden></div>
  </div>
  <button id="labels" class="btn" aria-pressed="false" title="Show every edge label in a stage view">Edge labels</button>
  <button id="fit" class="btn" title="Fit the graph to the screen (F)">Fit</button>
  <button id="theme" class="btn" title="Switch between light and dark">Dark</button>
</header>
<main>
  <aside id="side" aria-label="Trace, filters and legend">
    <section>
      <h2>Trace an input</h2>
      <select id="trace" aria-label="Choose an entry point to trace"><option value="">Choose an entry point…</option></select>
      <div id="trace-ctl" hidden>
        <button id="prev" class="btn" aria-label="Previous step">◀</button>
        <span id="trace-pos"></span>
        <button id="next" class="btn" aria-label="Next step">▶</button>
        <button id="trace-off" class="btn link">Stop</button>
      </div>
      <ol id="steps"></ol>
    </section>
    <section>
      <h2>Filter</h2>
      <fieldset id="types"><legend>Node type</legend></fieldset>
      <fieldset><legend>Flow</legend>
        <div class="radio-row" id="flows"></div>
      </fieldset>
      <fieldset><legend>Stage</legend>
        <select id="stage-filter" aria-label="Stage"><option value="all">All stages</option></select>
      </fieldset>
    </section>
    <section>
      <h2>Legend</h2>
      <div id="legend"></div>
    </section>
  </aside>
  <div id="canvas">
    <svg id="svg" role="img" aria-label="Pipeline graph">
      <defs>
        <marker id="arr-runtime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-runtime"/></marker>
        <marker id="arr-offline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-offline"/></marker>
        <marker id="arr-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-hl"/></marker>
        <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" class="hatch-bg"/><line x1="0" y1="0" x2="0" y2="8" class="hatch-line"/></pattern>
      </defs>
      <g id="vp"><g id="g-lanes"></g><g id="g-edges"></g><g id="g-labels"></g><g id="g-nodes"></g></g>
    </svg>
    <div id="hint"></div>
  </div>
  <aside id="panel" aria-live="polite" aria-label="Details"></aside>
</main>
<script id="flow-data" type="application/json">__FLOW_DATA__</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("flow-data").textContent);
const NODES = DATA.nodes;
const STAGES = DATA.stages;
const STAGE = Object.fromEntries(STAGES.map(s => [s.id, s]));
const TYPES = ["stage", "file", "model", "algorithm", "data-store", "external"];
const TYPE_NAME = { stage: "Stage", file: "Source file", model: "Model", algorithm: "Algorithm", "data-store": "Data store", external: "External" };
const STATUS = { unused: "UNUSED", stub: "STUB", legacy: "LEGACY", planned: "PLANNED" };
const NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const svg = $("#svg"), vp = $("#vp"), gLanes = $("#g-lanes"), gE = $("#g-edges"), gL = $("#g-labels"), gN = $("#g-nodes");
const stageOf = id => id.split("/")[0];
const num = sid => sid.slice(0, 3);
const OUT = {}, IN = {};
for (const e of DATA.edges) { (OUT[e.from] = OUT[e.from] || []).push(e); (IN[e.to] = IN[e.to] || []).push(e); }
const SOUT = {}, SIN = {};
for (const e of DATA.stageEdges) { (SOUT[e.from] = SOUT[e.from] || []).push(e); (SIN[e.to] = SIN[e.to] || []).push(e); }

const state = { view: null, sel: null, types: new Set(TYPES), flow: "all", stage: "all", allLabels: false, trace: null, step: -1 };
let graph = null;
const T = { x: 0, y: 0, k: 1 };

function svgEl(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) n.append(kid.nodeType ? kid : String(kid));
  return n;
}
function trunc(text, max) { text = String(text); return text.length > max ? text.slice(0, Math.max(1, max - 1)) + "…" : text; }
function missing(id) {
  const io = { type: "unknown", shape: "unknown", format: "unknown", example: "unknown" };
  return { id, label: id, type: "external", stage: stageOf(id), flow: "runtime", files: [], purpose: "This id is used by an edge but not defined in the flow data.",
           input: io, output: io, algorithm: { name: "unknown", params: {} }, performance: "unknown",
           decision: { summary: "Not defined.", tag: "UNKNOWN", source: "missing node" }, doc: "" };
}
const node = id => NODES[id] || STAGE[id] || missing(id);

// ---------- graphs ----------
function counts(sid) {
  const c = {};
  for (const n of Object.values(NODES)) if (n.stage === sid && n.type !== "stage") c[n.type] = (c[n.type] || 0) + 1;
  return c;
}
function overviewGraph() {
  const nodes = STAGES.map(s => {
    const c = counts(s.id);
    const line = ["file", "model", "algorithm", "data-store"].filter(t => c[t]).map(t => `${c[t]} ${t === "data-store" ? "store" : t}${c[t] > 1 ? "s" : ""}`).join(" · ");
    return { id: s.id, n: s, label: `${num(s.id)} ${s.label}`, sub: `${s.platform || ""} · ${s.flow}`, cnt: line, type: "stage", flow: s.flow };
  });
  return { nodes, edges: DATA.stageEdges, big: true };
}
function stageGraph(sid) {
  const own = Object.values(NODES).filter(n => n.stage === sid && n.type !== "stage");
  const ids = new Set(own.map(n => n.id));
  const edges = DATA.edges.filter(e => ids.has(e.from) || ids.has(e.to));
  const ghosts = new Set();
  for (const e of edges) for (const end of [e.from, e.to]) if (!ids.has(end)) ghosts.add(end);
  const nodes = own.map(n => ({ id: n.id, n, label: n.label, sub: n.key || TYPE_NAME[n.type], type: n.type, flow: n.flow, ghost: false }))
    .concat([...ghosts].map(id => { const n = node(id); return { id, n, label: n.label, sub: `↗ ${num(n.stage)} · ${TYPE_NAME[n.type] || n.type}`, type: n.type, flow: n.flow, ghost: true }; }));
  return { nodes, edges, big: false };
}

// ---------- layered left-to-right layout ----------
function layout(g) {
  const W = g.W, H = g.H, colGap = g.big ? 200 : 135, rowGap = g.big ? 46 : 22;
  const n = g.nodes.length, at = new Map(g.nodes.map((v, i) => [v.id, i]));
  const pairs = [];
  for (const e of g.edges) { const a = at.get(e.from), b = at.get(e.to); if (a !== undefined && b !== undefined && a !== b) pairs.push([a, b]); }
  const succ = g.nodes.map(() => []), pred = g.nodes.map(() => []);
  for (const [a, b] of pairs) { succ[a].push(b); pred[b].push(a); }
  const mark = new Array(n).fill(0), back = new Set();
  const visit = u => { mark[u] = 1; for (const v of succ[u]) { if (mark[v] === 1) back.add(u + ">" + v); else if (!mark[v]) visit(v); } mark[u] = 2; };
  [...Array(n).keys()].sort((a, b) => pred[a].length - pred[b].length || a - b).forEach(i => { if (!mark[i]) visit(i); });
  const fwd = pairs.map(([a, b]) => back.has(a + ">" + b) ? [b, a] : [a, b]);
  const out = g.nodes.map(() => []), inn = g.nodes.map(() => []), deg = new Array(n).fill(0), layer = new Array(n).fill(0);
  for (const [a, b] of fwd) { out[a].push(b); inn[b].push(a); deg[b]++; }
  const queue = [...Array(n).keys()].filter(i => !deg[i]);
  while (queue.length) { const u = queue.shift(); for (const v of out[u]) { layer[v] = Math.max(layer[v], layer[u] + 1); if (--deg[v] === 0) queue.push(v); } }
  for (let i = 0; i < n; i++) if (!inn[i].length && out[i].length) layer[i] = Math.max(0, Math.min(...out[i].map(v => layer[v])) - 1);
  const linked = i => out[i].length || inn[i].length;
  const layers = [];
  for (let i = 0; i < n; i++) if (linked(i)) (layers[layer[i]] = layers[layer[i]] || []).push(i);
  const filled = layers.filter(Boolean);
  const pos = new Array(n).fill(0);
  const typeRank = t => TYPES.indexOf(t);
  filled.forEach(L => { L.sort((a, b) => typeRank(g.nodes[a].type) - typeRank(g.nodes[b].type) || g.nodes[a].label.localeCompare(g.nodes[b].label)); L.forEach((i, k) => pos[i] = k - (L.length - 1) / 2); });
  for (let it = 0; it < 8; it++) {
    const down = it % 2 === 0, seq = down ? filled : [...filled].reverse();
    for (const L of seq) {
      const bary = i => { const nb = down ? inn[i] : out[i]; return nb.length ? nb.reduce((s, j) => s + pos[j], 0) / nb.length : pos[i]; };
      const b = new Map(L.map(i => [i, bary(i)]));
      L.sort((x, y) => b.get(x) - b.get(y));
      L.forEach((i, k) => pos[i] = k - (L.length - 1) / 2);
    }
  }
  filled.forEach((L, l) => L.forEach(i => { g.nodes[i].x = l * (W + colGap); g.nodes[i].y = pos[i] * (H + rowGap); }));
  const lone = [...Array(n).keys()].filter(i => !linked(i));

  if (ev.key === "ArrowDown" && i < items.length - 1) { ev.preventDefault(); items[i + 1].focus(); }
  if (ev.key === "ArrowUp") { ev.preventDefault(); (i > 0 ? items[i - 1] : q).focus(); }
  if (ev.key === "Escape") { results.hidden = true; q.focus(); }
});
document.addEventListener("click", ev => { if (!ev.target.closest(".search")) results.hidden = true; });
document.addEventListener("keydown", ev => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (ev.key === "/" && !typing) { ev.preventDefault(); q.focus(); q.select(); }
  else if ((ev.key === "f" || ev.key === "F") && !typing) fit();
  else if (ev.key === "Escape" && !typing && state.sel && state.view !== "overview" && state.sel !== state.view) go(state.view);
});

// ---------- filters, legend, toolbar ----------
for (const t of TYPES) {
  const box = h("input", { type: "checkbox", checked: true, onchange: ev => { ev.target.checked ? state.types.add(t) : state.types.delete(t); restyle(); } });
  $("#types").append(h("label", { class: "check" }, box, h("span", { class: "sw", style: `background: var(--${t})` }), TYPE_NAME[t]));
}
for (const [value, text] of [["all", "All"], ["runtime", "Runtime"], ["offline", "Offline"]]) {
  $("#flows").append(h("label", { class: "check" }, h("input", { type: "radio", name: "flow", value, checked: value === "all", onchange: () => { state.flow = value; restyle(); } }), text));
}
for (const s of STAGES) $("#stage-filter").append(h("option", { value: s.id }, `${num(s.id)} ${s.label}`));
$("#stage-filter").addEventListener("change", ev => { state.stage = ev.target.value; if (state.stage !== "all" && state.view !== "overview") go(state.stage); else restyle(); search(); });
for (const t of DATA.traces) $("#trace").append(h("option", { value: t.id }, t.label));
function legendLine(cls, text, dash) {
  const s = svgEl("svg", { width: 40, height: 12 });
  svgEl("line", { x1: 2, y1: 6, x2: 38, y2: 6, class: cls, "stroke-dasharray": dash || null, style: "stroke-width:2.2" }, s);
  return h("div", { class: "legend-row" }, s, text);
}
$("#legend").append(
  ...TYPES.map(t => h("div", { class: "legend-row" }, h("span", { class: "sw", style: `background: var(--${t})` }), TYPE_NAME[t])),
  legendLine("edge f-runtime", "Runtime data (app, prototype)"),
  legendLine("edge f-offline", "Offline lab work (dashed)"),
  legendLine("edge hl", "Selected or traced path"),
  h("div", { class: "legend-row" }, h("span", { class: "pill tag-INFERRED" }, "INF"), "Reason inferred from code"),
  h("div", { class: "legend-row" }, h("span", { class: "pill tag-UNKNOWN" }, "UNK"), "Reason unknown (open question)"),
  h("div", { class: "legend-row" }, h("span", { class: "pill" }, "UNUSED"), "Hatched box: unused, stub or legacy"),
  h("div", { class: "legend-row" }, h("span", { class: "pill" }, "⚑2"), "Flags: bugs, gaps, mismatches"),
  h("div", { class: "legend-row" }, h("span", { class: "pill", style: "opacity:.6" }, "↗ s03"), "Faded box: from another stage"));
$("#labels").addEventListener("click", ev => { state.allLabels = !state.allLabels; ev.currentTarget.setAttribute("aria-pressed", String(state.allLabels)); restyle(); });
$("#fit").addEventListener("click", fit);
$("#menu").addEventListener("click", ev => { const open = $("#side").classList.toggle("open"); ev.currentTarget.setAttribute("aria-expanded", String(open)); });
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#theme").textContent = t === "dark" ? "Light" : "Dark";
  try { localStorage.setItem("eykon-flow-theme", t); } catch (e) { /* storage may be blocked on file:// */ }
}
let saved = null;
try { saved = localStorage.getItem("eykon-flow-theme"); } catch (e) { saved = null; }
setTheme(saved === "dark" || saved === "light" ? saved : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#theme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

route();
})();
</script>
</body>
