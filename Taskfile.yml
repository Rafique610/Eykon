version: '3'

tasks:
  run:
    desc: Start the Streamlit application
    cmd: uv run streamlit run src/ui/app.py

  install:
    desc: Install all Python dependencies via uv
    cmd: uv sync

  pull-model:
    desc: Pull the recommended Ollama model (gemma2:2b)
    cmd: ollama pull gemma2:2b

  check-config:
    desc: Verify and print resolved configuration
    cmd: uv run python -c "from src.config import Settings; print(Settings())"

  test:
    desc: Run storage layer, embedder, and config verification tests
    cmd: uv run python -c "from src.config import Settings; from src.memories import init_db, count_memories, Embedder; init_db(); emb = Embedder(); print('Config, Storage & Embedder OK | Count:', count_memories(), '| Dim:', len(emb.embed('test')))"
