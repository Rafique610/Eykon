version: '3'

tasks:
  run:
    desc: Start the Streamlit application
    cmd: uv run streamlit run src/ui/app.py

  install:
    desc: Install all Python dependencies via uv
    cmd: uv sync

  pull-model:
    desc: Pull the recommended Ollama model (gemma2:2b)
    cmd: ollama pull gemma2:2b

  check-config:
    desc: Verify and print resolved configuration
    cmd: uv run python -c "from src.config import Settings; print(Settings())"

  test:
    desc: Run storage layer, embedder, chunking, capture, and config verification tests
    cmd: uv run python -c "from src.config import Settings; from src.memories import init_db, count_memories, Embedder, create_memories_from_text; init_db(); emb = Embedder(); recs = create_memories_from_text('Test memory chunking', emb); print('Config, Storage, Embedder, Chunking & Capture OK | Count:', count_memories(), '| Chunks:', len(recs), '| Metadata:', recs[0].metadata)"


